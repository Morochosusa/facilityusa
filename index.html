<style>
:root{--ac:#FBBC05;--acbg:#FEF1CD;--ink:#1C1C1C;--brown:#342A0D;--ok:#3d8b46;--okbg:#e4f1e5;--wn:#9a5b00;--wnbg:#FEF1CD;--er:#c5221f;--erbg:#fce8e6;--mu:#6b6860;--bd:#d6d3c8;--s1:#fff;--s2:#eceae2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#F6F5F3;color:#1C1C1C;font:16px Poppins,-apple-system,Segoe UI,Roboto,Arial,sans-serif;touch-action:manipulation}
#app{display:flex;min-height:100vh}
#side{width:196px;background:var(--s1);border-right:1px solid var(--bd);padding:14px 10px;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;margin:2px 6px 12px;cursor:pointer}.brand img{width:44px;height:44px;flex-shrink:0}.brand b{display:block;font-size:16px;font-weight:800;letter-spacing:.04em;color:#1f1f1d;line-height:1.1}.brand small{display:block;font-size:11px;font-weight:500;color:var(--mu);margin-top:2px}
.nav{display:block;width:100%;text-align:left;padding:10px 12px;margin-bottom:4px;border:0;border-radius:10px;background:none;font-size:14px;font-weight:600;color:#1f1f1d;cursor:pointer}
.nav.on{background:var(--ac);color:var(--ink);font-weight:700}
#main{flex:1;min-width:0}
#top{background:var(--s1);border-bottom:1px solid var(--bd);padding:8px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
#top b{font-size:17px}
.chip{padding:6px 12px;border-radius:99px;font-size:13px;font-weight:700;background:var(--s2)}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.off{background:var(--erbg);color:var(--er)}
#view{padding:14px}#pr-root{position:relative}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:2px solid var(--bd);background:var(--s1);font-size:15px;font-weight:600;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--ac);border-color:var(--ac);color:var(--ink)}
.btn.g{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.w{background:var(--wnbg);border-color:var(--wn);color:var(--wn)}
.btn.d{background:var(--erbg);border-color:var(--er);color:var(--er)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--s1);border:3px solid var(--bd);border-radius:16px;padding:10px;min-height:150px;cursor:pointer;position:relative;text-align:center}
.card.sel{border-color:var(--ac);background:var(--acbg)}
.card .th{height:80px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;margin-bottom:8px}

  #pr-root #pr-snack{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--hh,90px) + 8px);z-index:40;display:none;width:min(560px,94%)}
  #pr-root #pr-snack.show{display:block}
  #pr-root .snackbox{background:#26261f;color:#fff;border-radius:16px;padding:10px 10px 16px 18px;display:flex;align-items:center;gap:12px;position:relative;overflow:hidden}
  #pr-root .snackbox .st{flex:1;font-size:17px;font-weight:600}
  #pr-root .snackbox .btn{background:#fff;color:#1f1f1d;border-color:#fff}
  #pr-root .snackbar{position:absolute;left:0;bottom:0;height:6px;background:#4cc38a;width:100%;animation:pr-cd 10s linear forwards}
  #pr-root #pr-toast{position:absolute;left:50%;transform:translateX(-50%);bottom:110px;z-index:70;background:#26261f;color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;display:none;max-width:92%;text-align:center}
  #pr-root #pr-toast.show{display:block}
  #pr-root .pr-back{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:12px}
  #pr-root .pr-modal{background:var(--s1);border-radius:20px;width:100%;max-width:520px;max-height:100%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  #pr-root .pr-modal.wide{max-width:720px}
  #pr-root .mt{font-size:22px;font-weight:800}
  #pr-root .err{color:var(--er);font-weight:700;min-height:22px}
  #pr-root .label{background:#fff;color:#000;border:2px solid #000;border-radius:6px;padding:10px 12px;display:grid;grid-template-columns:1fr 84px;gap:2px 10px;font-family:system-ui,sans-serif;width:100%;max-width:420px;margin:auto}
  #pr-root .label .l1{grid-column:1;font-size:24px;font-weight:800;line-height:1.1}
  #pr-root .label .l2{grid-column:1;font-size:20px;font-weight:700}
  #pr-root .label .l3{grid-column:1;font-size:14px}
  #pr-root .label .l4{grid-column:1/3;font-size:30px;font-weight:900;margin-top:4px;border-top:2px solid #000;padding-top:4px}
  #pr-root .label .l5{grid-column:1/3;display:flex;justify-content:space-between;font-size:13px;font-weight:600;gap:8px}
  #pr-root .label .qr{grid-column:2;grid-row:1/4;width:84px;height:84px;align-self:start}
  #pr-root .label.mini{padding:6px 8px;grid-template-columns:1fr 58px;gap:1px 8px}
  #pr-root .label.mini .l1{font-size:17px}
  #pr-root .label.mini .l2{font-size:15px}
  #pr-root .label.mini .l3{font-size:12px}
  #pr-root .label.mini .l4{font-size:21px;margin-top:2px;padding-top:2px}
  #pr-root .label.mini .l5{font-size:11px;flex-wrap:wrap}
  #pr-root .label.mini .qr{width:58px;height:58px}
  #pr-root table{border-collapse:collapse;width:100%;font-size:15px}
  #pr-root th,#pr-root td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd)}
  #pr-root textarea{width:100%;min-height:160px;font:13px/1.4 ui-monospace,Menlo,monospace;background:var(--s2);color:#1f1f1d;border:1px solid var(--bd);border-radius:12px;padding:10px;-webkit-user-select:text;user-select:text}
  #pr-root label.btn{display:inline-flex;font-size:inherit;color:#1f1f1d;margin:0}
  #pr-root label.btn.pri{color:var(--acfg)}
  #pr-root .tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--u)*170px),1fr));gap:8px}
  #pr-root .tgrid .btn{justify-content:flex-start;text-align:left;font-size:16px}
  #pr-root .tgrid .btn.on{background:var(--acbg);border-color:var(--acx);color:var(--acx)}
  #pr-root .catt{grid-column:1/-1;font-weight:800;color:var(--acx);margin-top:8px}
  #pr-root .subcatt{grid-column:1/-1;font-size:13px;font-weight:700;color:var(--mu);text-transform:uppercase}

  @keyframes pr-pop{0%{transform:scale(1.2)}100%{transform:scale(1)}}
  @keyframes pr-cd{to{width:0}}
  #pr-root .gsec{grid-column:1/-1;font-size:13px;font-weight:700;color:var(--mu);text-transform:uppercase;margin-top:4px}
  #pr-root .kdisp{display:flex;align-items:baseline;justify-content:center;gap:10px;background:var(--s2);border-radius:14px;padding:10px}
  #pr-root .kdisp .n{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums}
  #pr-root .kdisp .u{font-size:20px;color:var(--mu);font-weight:700}
  #pr-root .modos .btn.on{color:var(--acfg)}
  #pr-root .tgrid .btn.on{color:var(--acx)}
  #pr-root .chipv svg{flex-shrink:0}



#pr-root{display:none;flex-direction:column;width:100%}
#pr-root #pr-top{gap:8px;padding:6px 10px}#pr-root #pr-top .btn,#pr-root #pr-top .stat{padding:0 12px;font-size:16px;min-height:calc(var(--u)*54px);min-width:0}#pr-root #pr-top .ops{gap:6px}
.ini{min-height:calc(100vh - 120px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:20px}.ini img{width:150px;height:150px;margin-bottom:14px}.ini h1{margin:0;font-size:26px;font-weight:800;letter-spacing:.03em;color:var(--brown);line-height:1.2}.ini p{margin:4px 0 22px;font-size:13px;font-weight:500;color:var(--mu)}.ini .btn{min-width:240px}
</style>

function mover(pid, dir){

  np = Math.max(0, Math.min(n - 1, np)); if(np === pos){ snd('warn'); toast('Ya no se puede mover más en esa dirección'); return; }

    return '<svg class="qr" viewBox="-2 -2 ' + (n + 4) + ' ' + (n + 4) + '" shape-rendering="crispEdges" aria-hidden="true"><rect x="-2" y="-2" width="' + (n + 4) + '" height="' + (n + 4) + '" fill="#fff"/><path d="' + p + '" fill="#000"/></svg>';

function registrar(){

  if(!(S.qty > 0)){ snd('warn'); toast('Pon una cantidad'); return; }
  const dup = S.regs.filter(r => r.pid === f.id && !r.anulado && eq(r.cant, S.qty) && (Date.now() - r.ts) < 120000)[0], alto = S.qty > maxOf(f);
  const g = S.guard && S.guard.pid === f.id && eq(S.guard.qty, S.qty) && S.guard.until > Date.now();
  if((alto || dup) && !g){ S.guard = {pid:f.id, qty:S.qty, until:Date.now() + 5000, kind:alto ? 'max' : 'dup'}; snd('warn'); renderPanel(); setTimeout(() => { if(S.screen === 'main') renderPanel(); }, 5100); return; }
  S.guard = null;
  const now = new Date(), vida = tieneVida(f), dias = vida ? f.vida[S.modo] : 0, vence = vida ? venceDe(now, dias) : null, etq = S.etqOv != null ? S.etqOv : etqOf(f, S.qty);
  const r = {id:uid(), pid:f.id, nombre:f.nombre, unidad:f.unidad, presentacion:f.presentacion, cant:S.qty, cpe:S.etqOv != null ? round2(S.qty / etq) : (f.por_etiqueta > 0 ? f.por_etiqueta : 0), batches:round2(S.qty / f.batch), modo:S.modo, ts:now.getTime(),
             vence:vence ? vence.getTime() : 0, dias:dias, lote:nextLote(f, now), etq:vida ? etq : 0, op:S.op, anulado:false, impresa:false, prueba:!!S.prueba, por:(API.quien ? API.quien() : '')};
  S.regs.unshift(r);
  Promise.resolve().then(() => STORE.guardarRegistro(r)).catch(err => { console.error(err); snd('err'); toast('No se pudo guardar'); });
  S.ultima[f.id] = S.qty; LSset('ultima', S.ultima); S.undo = r;
  if(vida) imprimirReg(r);
  flash('ok', 'Guardado'); snd('ok'); showSnack(r);
  if(!vida) setTimeout(() => toast('Sin etiqueta: falta la vida útil en la ficha'), 900);
  S.pid = null;
  if(S.screen === 'main'){ document.querySelectorAll('#pr-grid .card').forEach(c => c.classList.remove('sel')); renderPanel(); }
  renderTop();
  try { alRegistrar(r); } catch(e){ console.error(e); }
}

  L.push('^FO' + m + ',' + y + '^A0N,' + fT + ',' + fT + '^FB' + anchoTexto + ',2,0,L,0^FD' + e.titulo + '^FS'); y += fT * 2 + 6;

/* --- por cable USB (WebUSB, solo Chrome con https) --- */
const usbSoportado = () => !!(navigator.usb && window.isSecureContext !== false);
function usbBuscarSalida(dev){
  let mejor = null;
  (dev.configurations || []).forEach(cf => cf.interfaces.forEach(itf => itf.alternates.forEach(al => al.endpoints.forEach(ep => {
    if(ep.direction === 'out' && ep.type === 'bulk'){ const pts = al.interfaceClass === 7 ? 2 : 1; if(!mejor || pts > mejor.pts) mejor = {pts:pts, itf:itf.interfaceNumber, alt:al.alternateSetting, ep:ep.endpointNumber}; }
  }))));

}
async function usbAbrir(dev){
  if(!dev.opened) await dev.open(); if(dev.configuration == null) await dev.selectConfiguration(1);
  const s = usbBuscarSalida(dev); if(!s) throw new Error('Este aparato USB no tiene salida de impresión');
  try { await dev.claimInterface(s.itf); } catch(e){ if(!/already|claimed/i.test(e.message || '')) throw e; }
  if(s.alt){ try { await dev.selectAlternateInterface(s.itf, s.alt); } catch(e){} }
  U.dev = dev; U.itf = s.itf; U.ep = s.ep; U.estado = 'listo'; U.msg = (dev.productName || 'Impresora') + ' conectada por cable'; LSset('usb_dev', {v:dev.vendorId, p:dev.productId});
}
async function usbConectar(pedir){
  if(!navigator.usb){ U.estado = 'off'; U.msg = 'Este navegador no permite USB. Abre la página en Chrome.'; return false; }
  try {
    let dev = null;

    else { const ya = await navigator.usb.getDevices(), g = LSget('usb_dev', null); dev = ya.filter(d => g && d.vendorId === g.v && d.productId === g.p)[0] || ya.filter(d => usbBuscarSalida(d))[0] || null;
      if(!dev){ U.estado = 'sin'; U.msg = 'Impresora sin conectar. Toca “Conectar impresora por cable”.'; return false; } }
    await usbAbrir(dev); return true;
  } catch(e){ U.estado = 'sin'; U.msg = e && e.name === 'NotFoundError' ? 'No elegiste ninguna impresora.' : 'No se pudo conectar: ' + ((e && e.message) || e); return false; }
}
async function usbEnviar(texto){
  if(!navigator.usb) throw new Error('Este navegador no permite USB. Abre la página en Chrome.');
  const bytes = new TextEncoder().encode(texto);
  const intentar = async () => {
    if(U.estado !== 'listo' || !U.dev || !U.dev.opened){ if(!(await usbConectar(false))) throw new Error('La impresora no está conectada por cable'); }

  };

}

function usbIniciar(){
  if(!navigator.usb) return;
  navigator.usb.addEventListener('connect', () => { if(S.imp === 'usb') usbConectar(false).then(renderTop); });
  navigator.usb.addEventListener('disconnect', ev => { if(U.dev && ev.device === U.dev){ U.dev = null; U.estado = 'sin'; U.msg = 'Se desconectó el cable de la impresora.'; renderTop(); } });
  if(S.imp === 'usb') usbConectar(false).then(renderTop);

}
function kpPaint(abrir){
  const o = K.o, keys = ['7','8','9','4','5','6','1','2','3', o.dec !== false ? ',' : 'C', '0', 'back'];
  const html = '<div class="mt">' + esc(o.titulo || 'Cantidad') + '</div><div class="kdisp"><span class="n">' + (K.buf === '' ? '0' : K.buf.replace('.', ',')) + '</span><span class="u">' + esc(o.unidad || '') + '</span></div>' +

}
function kpKey(k){
  if(K.fresh){ K.buf = ''; K.fresh = false; if(k === 'back'){ kpPaint(); return; } }
  if(k === 'back') K.buf = K.buf.slice(0, -1); else if(k === 'C') K.buf = '';
  else if(k === ',' || k === '.'){ if(K.buf.indexOf('.') < 0) K.buf = (K.buf || '0') + '.'; }
  else { const dec = K.buf.split('.')[1]; if(dec !== undefined && dec.length >= 2) { return; } if(K.buf.replace('.', '').length >= 7) return; K.buf = (K.buf === '0' ? '' : K.buf) + k; }
  kpPaint();
}
function kpOk(){
  const o = K.o, v = K.buf === '' ? null : round2(parseFloat(K.buf));
  if((v == null || v === 0) && !o.cero){ snd('warn'); toast('Pon un número mayor que 0'); return; }

function onClick(e){

  }

const S={cat:[],ped:[],lc:[],lp:[],prod:[],guias:[],pruebas:[],fichas:{},inv:{},mp:{},cfg:{},equipo:{},avisos:{},orden:{}};
const LOCKED=['pedidos','compras','interna','guias','catalogo'];

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>Math.round(parseFloat(String(v).replace(',','.'))*100)/100;
const newId=c=>doc(collection(db,c)).id;
function fecha(ts){try{const d=ts?.toDate?ts.toDate():(ts?new Date(ts):null);return d?d.toLocaleString('es-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'enviando...'}catch(e){return ''}}
function hue(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h}
function ini(n){return String(n).split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}
function thumb(p){const fo=S.fichas[p.id]&&S.fichas[p.id].foto;if(fo)return `<img class="th" src="${fo}" alt="" style="object-fit:cover">`;const h=hue(p.id);return `<div class="th" style="background:hsl(${h} 40% 86%);color:hsl(${h} 40% 28%)">${esc(ini(p.nombre))}</div>`}
function buzz(err){try{navigator.vibrate&&navigator.vibrate(err?[60,40,60]:30)}catch(e){}try{if(tab.sonido){const A=window.AudioContext||window.webkitAudioContext;if(A){window._ac=window._ac||new A();const o=window._ac.createOscillator(),g=window._ac.createGain();o.frequency.value=err?220:880;g.gain.value=.05;o.connect(g);g.connect(window._ac.destination);o.start();o.stop(window._ac.currentTime+(err?.25:.04))}}}catch(e){}}

onSnapshot(collection(db,C.cat),s=>{S.cat=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.nombre.localeCompare(b.nombre));prSyncKey('cat');softRender();if(!seeded&&!s.docs.length){seeded=true;let ya=false;try{ya=localStorage.getItem('fusa_seed_ok')}catch(e){}if(!ya)setTimeout(()=>{if(!S.cat.length&&window.cargarSeed){cargarSeed();try{localStorage.setItem('fusa_seed_ok','1')}catch(e){}}},1500)}},e=>console.error(e));

window.go=v=>{if(LOCKED.includes(v))return;if(v==='panel'&&view!=='panel'){pedirAdmin(()=>goView(v));return}goView(v)};

let prShown=false;
function prFit(){const r=$('pr-root'),side=document.getElementById('side');let h=window.innerHeight-$('top').offsetHeight;if(window.innerWidth<=760&&side)h-=side.offsetHeight;r.style.height=Math.max(420,h)+'px';try{PRODREG.mostrar&&r.style.display!=='none'&&0}catch(e){}}
window.addEventListener('resize',()=>{if(prShown){prFit();PRODREG.mostrar()}});
function render(){
  document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  $('btn-panel').classList.toggle('p',view==='panel');
  const showPR=prIni&&view==='produccion'&&pr.mode==='op';
  $('pr-root').style.display=showPR?'flex':'none';$('view').style.display=showPR?'none':'';
  if(showPR){prFit();if(!prShown){prShown=true;PRODREG.mostrar()}}else prShown=false;
  $('ttl').textContent=TITULOS[view];
  if(mOpen)menuDibujar();

}

/* ============ CATÁLOGO ============ */
function vCatalogo(){
  const rows=S.cat.map(p=>`<tr><td><b>${esc(p.nombre)}</b></td><td>${esc(CATEGORIAS[p.categoria]||'')}</td><td>${esc(p.subcategoria)}${p.area_produccion?' · '+esc(AREAS[p.area_produccion]):''}</td><td>${esc(p.unidad_medida)}</td><td><button class="btn sm d" onclick="delProd('${p.id}')">Borrar</button></td></tr>`).join('');
  return `<div class="box"><h3>Agregar producto</h3><div class="row">
   <div class="f"><label>Nombre</label><input id="c_n" placeholder="Ej. Pan de hamburguesa"></div>
   <div class="f"><label>Unidad</label><input id="c_u" placeholder="Ej. bolsa x 12 uds"></div>
   <div class="f"><label>Categoría</label><select id="c_c">${Object.entries(CATEGORIAS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
   <div class="f"><label>Subcategoría</label><select id="c_s" onchange="document.getElementById('c_ar').style.display=this.value==='facility'?'':'none'">${Object.entries(SUBS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
   <div class="f" id="c_ar" style="display:none"><label>Se produce en</label><select id="c_a">${Object.entries(AREAS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
   <button class="btn p" onclick="addProd()">Agregar</button></div></div>
   ${faltanSeed()?`<div class="box" style="border-color:var(--ac)"><h3>Productos iniciales de Facility USA</h3><div class="mu" style="margin-bottom:10px">${SEED.length} productos (Panadería producción, Proteínas y Produce). Se cargan una sola vez; si ya existen no se duplican.</div><button class="btn p" onclick="cargarSeed()">Cargar ${faltanSeed()} productos</button></div>`:''}
   <div class="box">${S.cat.length?`<table><tr><th>Producto</th><th>Categoría</th><th>Subcategoría</th><th>Unidad</th><th></th></tr>${rows}</table>`:'<div class="empty">El catálogo está vacío. Agrega los productos uno por uno.</div>'}</div>`;
}
const seedId=n=>'seed_'+n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
function faltanSeed(){const ex=new Set(S.cat.map(p=>p.id));return SEED.filter(s=>!ex.has(seedId(s[1]))).length}
window.cargarSeed=()=>{
  const ex=new Set(S.cat.map(p=>p.id)),b=writeBatch(db);let n=0;
  SEED.forEach(([area,nombre,uni,pres])=>{
    const id=seedId(nombre);if(ex.has(id))return;
    b.set(doc(db,C.cat,id),{nombre,unidad_medida:pres?uni+' · '+pres:uni,unidad_base:uni,presentacion:pres,categoria:area==='panaderia'?'panaderia':'cocina',subcategoria:'facility',area_produccion:area,activo:true});n++;
  });
  if(!n)return;b.commit();buzz();toast(n+' productos cargados');
};
window.addProd=()=>{
  const nombre=$('c_n').value.trim(),unidad=$('c_u').value.trim();
  if(!nombre||!unidad){toast('Falta nombre o unidad');return}
  const sub=$('c_s').value,id=newId(C.cat);
  const data={nombre,unidad_medida:unidad,categoria:$('c_c').value,subcategoria:sub,area_produccion:sub==='facility'?$('c_a').value:null,activo:true};
  setDoc(doc(db,C.cat,id),data);buzz();toast('Producto agregado');
};
window.delProd=id=>{const p=S.cat.find(x=>x.id===id);if(!p)return;const copia={...p};delete copia.id;deleteDoc(doc(db,C.cat,id));toast('Producto borrado',()=>setDoc(doc(db,C.cat,id),copia))};

/* ============ PEDIDOS DE LOCALES ============ */
function vPedidos(){
  if(modo==='nuevo')return vNuevoPedido();
  const list=S.ped.map(p=>{
    const items=(p.items||[]).map(i=>`<tr><td>${esc(i.producto_nombre)}</td><td>${esc(i.cantidad)} ${esc(i.unidad_medida)}</td><td class="mu">${esc(i.subcategoria)}</td></tr>`).join('');
    return `<div class="box"><div class="row" style="justify-content:space-between;margin:0 0 8px"><div><b style="font-size:18px">${esc(LOCALES[p.local]||p.local)}</b> <span class="badge b-${p.estado}">${esc(p.estado.replace('_',' '))}</span><div class="mu">${fecha(p.fecha_envio)} · ${esc(p.enviado_por||'')}${p.nota?' · '+esc(p.nota):''}</div></div>
      <div class="row" style="margin:0">${p.estado!=='procesado'?`<button class="btn sm g" onclick="pedEstado('${p.id}','procesado')">Marcar procesado</button>`:''}${p.estado==='enviado'?`<button class="btn sm d" onclick="delPed('${p.id}')">Eliminar</button>`:''}</div></div>
      <table>${items}</table></div>`}).join('');
  return `<div class="row"><button class="btn p" onclick="nuevoPedido()">+ Nuevo pedido</button></div>${list||'<div class="empty">Todavía no hay pedidos.</div>'}`;
}
window.nuevoPedido=()=>{modo='nuevo';render()};
window.cancelarPedido=()=>{modo='lista';cart={};render()};
function vNuevoPedido(){
  const cards=S.cat.map(p=>{const q=cart[p.id];return `<div class="card ${q?'sel':''}" data-n="${esc(p.nombre.toLowerCase())}" onclick="tapProd('${p.id}')">${q?`<span class="q">${q}</span><span class="ck">✓</span>`:''}${thumb(p)}<div class="n">${esc(p.nombre)}</div><div class="u">${esc(p.unidad_medida)}</div></div>`}).join('');
  const n=Object.keys(cart).length;
  return `<div class="row"><div class="f"><label>Local</label><select id="p_l" onchange="setLocal(this.value)"><option value="">Elegir local</option>${Object.entries(LOCALES).map(([k,v])=>`<option value="${k}" ${k===localSel?'selected':''}>${v}</option>`).join('')}</select></div>
   <div class="f"><label>Quién envía</label><input id="p_q" value="${esc(quien)}" onchange="setQuien(this.value)"></div>
   <div class="f"><label>Buscar</label><input placeholder="Buscar producto" oninput="filtrar(this.value)"></div></div>
   <div class="grid">${cards||'<div class="empty" style="grid-column:1/-1">Primero agrega productos en Catálogo.</div>'}</div>
   <div class="row" style="margin-top:16px;position:sticky;bottom:10px;background:#f4f2ecee;padding:8px;border-radius:14px">
    <b>${n} productos</b><div class="f"><input id="p_nota" placeholder="Nota (opcional)"></div>
    <button class="btn" onclick="cancelarPedido()">Cancelar</button><button class="btn g" onclick="enviarPedido()">Enviar pedido</button></div>`;
}
window.setLocal=v=>{localSel=v;localStorage.setItem('fusa_local',v)};
window.setQuien=v=>{quien=v.trim();localStorage.setItem('fusa_quien',quien)};
window.filtrar=t=>{t=t.toLowerCase();document.querySelectorAll('.grid .card').forEach(c=>c.style.display=c.dataset.n.includes(t)?'':'none')};
window.tapProd=id=>{buzz();const p=S.cat.find(x=>x.id===id);abrirCantidad(p.nombre+' ('+p.unidad_medida+')',cart[id]||1,v=>{if(v>0)cart[id]=v;else delete cart[id];render()})};
window.enviarPedido=()=>{
  const ids=Object.keys(cart);
  if(!localSel){toast('Elige el local');return}
  if(!ids.length){toast('El pedido está vacío');return}
  const items=ids.map(id=>{const p=S.cat.find(x=>x.id===id);return {producto_id:id,producto_nombre:p.nombre,unidad_medida:p.unidad_medida,categoria:p.categoria,subcategoria:p.subcategoria,area_produccion:p.area_produccion||null,cantidad:cart[id],nota:''}});
  const id=newId(C.ped);
  setDoc(doc(db,C.ped,id),{local:localSel,estado:'enviado',enviado_por:quien||'',fecha_envio:serverTimestamp(),nota:($('p_nota')?.value||'').trim(),items,ajustes:{},compra_lista_id:null,produccion_lista_id:null,despacho_id:null});
  cart={};modo='lista';render();buzz();
  toast('Pedido enviado',()=>deleteDoc(doc(db,C.ped,id)));
};
window.delPed=id=>deleteDoc(doc(db,C.ped,id));
window.pedEstado=(id,e)=>updateDoc(doc(db,C.ped,id),{estado:e,fecha_proceso:serverTimestamp()});

/* ============ LISTA DE COMPRAS (subcategoría mercado) ============ */
function agrupar(sub){
  const pend=S.ped.filter(p=>p.estado==='enviado'&&!(sub==='mercado'?p.compra_lista_id:p.produccion_lista_id));
  const m={};
  pend.forEach(p=>(p.items||[]).filter(i=>i.subcategoria===sub).forEach(i=>{
    const q=(p.ajustes&&p.ajustes[i.producto_id]!=null)?p.ajustes[i.producto_id]:i.cantidad;
    if(!q)return;
    const o=m[i.producto_id]||(m[i.producto_id]={producto_id:i.producto_id,producto_nombre:i.producto_nombre,unidad_medida:i.unidad_medida,area_produccion:i.area_produccion||null,cantidad:0});
    o.cantidad=Math.round((o.cantidad+q)*100)/100;
  }));
  return {pend,items:Object.values(m)};
}
function vCompras(){
  const g=agrupar('mercado');
  const nueva=`<div class="box"><h3>Pendiente por comprar</h3>${g.items.length?`<table>${g.items.map(i=>`<tr><td>${esc(i.producto_nombre)}</td><td>${esc(i.cantidad)} ${esc(i.unidad_medida)}</td></tr>`).join('')}</table><div class="row" style="margin-top:12px"><button class="btn p" onclick="genCompra()">Generar lista de compras (${g.pend.length} pedidos)</button></div>`:'<div class="empty">No hay productos de mercado pendientes.</div>'}</div>`;
  const listas=S.lc.map(l=>{
    const tot=(l.items||[]).reduce((s,i)=>s+(i.costo||0),0);
    return `<div class="box"><div class="row" style="justify-content:space-between;margin:0 0 8px"><div><b>Lista ${fecha(l.fecha_ms)}</b> <span class="badge b-${l.estado==='cerrada'?'procesado':'en_proceso'}">${esc(l.estado)}</span><div class="mu">Total: $${tot.toFixed(2)}</div></div>${l.estado!=='cerrada'?`<button class="btn sm g" onclick="cerrarCompra('${l.id}')">Cerrar lista</button>`:''}</div>
    <table>${(l.items||[]).map((i,ix)=>`<tr><td><input type="checkbox" style="width:26px;height:26px;min-height:0" ${i.comprado?'checked':''} onchange="toggleCompra('${l.id}',${ix},this.checked)"></td><td class="${i.comprado?'done':''}">${esc(i.producto_nombre)}</td><td>${esc(i.cantidad)} ${esc(i.unidad_medida)}</td><td><input type="number" step="0.01" min="0" style="width:100px" placeholder="Costo $" value="${i.costo??''}" onchange="costoCompra('${l.id}',${ix},this.value)"></td></tr>`).join('')}</table></div>`}).join('');
  return nueva+listas;
}
window.genCompra=()=>{
  const g=agrupar('mercado');if(!g.items.length)return;
  const id=newId(C.lc),b=writeBatch(db);
  b.set(doc(db,C.lc,id),{estado:'abierta',fecha_ms:Date.now(),items:g.items.map(i=>({producto_id:i.producto_id,producto_nombre:i.producto_nombre,unidad_medida:i.unidad_medida,cantidad:i.cantidad,comprado:false,costo:null})),pedidos:g.pend.map(p=>p.id)});
  g.pend.forEach(p=>b.update(doc(db,C.ped,p.id),{compra_lista_id:id,estado:'en_proceso',fecha_proceso:serverTimestamp()}));
  b.commit();buzz();toast('Lista de compras creada');
};
function itemsLista(id,arr,mut){const l=S[arr].find(x=>x.id===id);const items=JSON.parse(JSON.stringify(l.items));mut(items);return items}
window.toggleCompra=(id,ix,v)=>updateDoc(doc(db,C.lc,id),{items:itemsLista(id,'lc',a=>a[ix].comprado=v)});

/* ============ Conexión con el módulo de producción (PRODREG) ============ */
const areaNombre=k=>AREAS[k]||AREAS[AREA0];
const areaClave=n=>Object.keys(AREAS).find(k=>AREAS[k]===n)||AREA0;
function prProductos(){return S.cat.filter(p=>p.subcategoria==='facility').map(p=>({id:p.id,nombre:p.nombre,batch:1,uni:p.unidad_base||p.unidad_medida||'unidades',unidad:p.presentacion||'',seccion:areaNombre(p.area_produccion||AREA0)}))}
const mrec=d=>({...d,id:d.id,pid:d.pid||d.producto_id,nombre:d.pid?d.nombre:(d.producto_nombre||d.nombre),unidad:d.pid?d.unidad:(d.unidad_base||d.unidad_medida||''),presentacion:d.presentacion||'',cant:d.cant!=null?d.cant:cantReg(d),cpe:d.cpe!=null?d.cpe:(d.cantidad_por_etiqueta||0),modo:d.modo||d.conservacion_modo||'ref',ts:d.ts||d.fecha_ms,vence:d.vence||0,dias:d.dias!=null?d.dias:(d.dias_vida||0),lote:d.lote||'',etq:d.etq!=null?d.etq:(d.etiquetas||0),op:d.op||d.estacion||'',anulado:!!d.anulado,impresa:!!d.impresa,prueba:!!d.prueba,por:d.por||''});
function prSyncRegs(){const h=new Date().toDateString();PRODREG.setRegistros([...S.prod,...S.pruebas].filter(r=>(r.fecha_ms||r.ts)&&new Date(r.fecha_ms||r.ts).toDateString()===h).map(mrec))}
function prSyncOrden(){const o={};Object.keys(S.orden).forEach(k=>{if(AREAS[k])o[AREAS[k]]=(S.orden[k]||{}).ids||[]});PRODREG.setOrden(o)}
function prSyncKey(k){if(!prIni)return;if(k==='prod'||k==='pruebas')prSyncRegs();else if(k==='cat'){PRODREG.setProductos(prProductos());PRODREG.setFichas(S.fichas)}else if(k==='fichas')PRODREG.setFichas(S.fichas);else if(k==='orden')prSyncOrden();else if(k==='equipo'&&view==='produccion'&&pr.mode==='op')PRODREG.mostrar()}
function prDoc(r){
  const p=S.cat.find(x=>x.id===r.pid)||{};
  return {...r,producto_id:r.pid,producto_nombre:r.nombre,unidad_medida:p.unidad_medida||r.unidad,unidad_base:r.unidad,estacion:r.op,area:areaClave(r.op),inventario:!r.prueba,cantidad_producida:r.cant,cantidad_por_etiqueta:r.cpe>0?r.cpe:r.cant,conservacion_modo:r.modo,dias_vida:r.dias,etiquetas:r.etq,operador:r.op,fecha_ms:r.ts,fecha_produccion:serverTimestamp()};
}
function prGuardar(r){
  const p=S.cat.find(x=>x.id===r.pid);if(!p)return;const f=ficha(p),b=writeBatch(db),ms=r.ts;
  const insumos=f.receta.filter(i=>i.cantidad>0).map(i=>({materia_prima_id:i.mp_id||null,nombre:i.nombre,unidad:i.unidad,cantidad:r2(i.cantidad*r.cant/f.batch)}));
  b.set(doc(db,C.prod,r.id),{...prDoc(r),insumos,bajas:[]});
  b.set(doc(db,C.inv,p.id),{producto_id:p.id,nombre:p.nombre,unidad_medida:p.unidad_medida,cantidad_actual:increment(r.cant),ultima_actualizacion:serverTimestamp()},{merge:true});
  b.set(doc(collection(db,C.mov)),{producto_id:p.id,nombre:p.nombre,tipo:'produccion',cantidad:r.cant,lote:r.lote,registro_id:r.id,nota:'Produccion - '+r.op,fecha_ms:ms,fecha:serverTimestamp()});
  insumos.forEach(i=>{if(!i.materia_prima_id)return;
    b.set(doc(db,C.mp,i.materia_prima_id),{cantidad_actual:increment(-i.cantidad),ultima_actualizacion:serverTimestamp()},{merge:true});
    b.set(doc(collection(db,C.mov)),{materia_prima_id:i.materia_prima_id,nombre:i.nombre,tipo:'consumo_produccion',cantidad:i.cantidad,lote:r.lote,registro_id:r.id,fecha_ms:ms,fecha:serverTimestamp()})});
  b.commit();
}
function prActualizar(r){
  const prev=S.prod.find(x=>x.id===r.id);
  if(r.anulado&&prev&&!prev.anulado){prAnular(r.id,true)}
  else if(r.anulado&&!prev){setDoc(doc(db,C.prod,r.id),{anulado:true,anulado_ms:Date.now()},{merge:true})}
  if(r.impresa)updateDoc(doc(db,C.prod,r.id),{impresa:true});
}

/* --- Deshacer --- */
window.prAnular=(id,silent)=>{
  const r=S.prod.find(x=>x.id===id)||S.pruebas.find(x=>x.id===id);
  if(!r||r.anulado){return}
  const test=!!r.prueba,b=writeBatch(db),ms=Date.now();
  b.update(doc(db,test?C.pruebas:C.prod,id),{anulado:true,anulado_ms:ms});
  if(!test){
    b.set(doc(db,C.inv,r.producto_id),{cantidad_actual:increment(-cantReg(r)),ultima_actualizacion:serverTimestamp()},{merge:true});
    b.set(doc(collection(db,C.mov)),{producto_id:r.producto_id,nombre:r.producto_nombre,tipo:'anulacion_produccion',cantidad:-cantReg(r),lote:r.lote,registro_id:id,fecha_ms:ms,fecha:serverTimestamp()});
    (r.insumos||[]).forEach(i=>{if(!i.materia_prima_id)return;
      b.set(doc(db,C.mp,i.materia_prima_id),{cantidad_actual:increment(i.cantidad),ultima_actualizacion:serverTimestamp()},{merge:true});
      b.set(doc(collection(db,C.mov)),{materia_prima_id:i.materia_prima_id,nombre:i.nombre,tipo:'anulacion_consumo',cantidad:i.cantidad,registro_id:id,fecha_ms:ms,fecha:serverTimestamp()})});
    (r.bajas||[]).forEach((j,ix)=>{
      b.set(doc(db,C.mp,j.materia_prima_id),{cantidad_actual:increment(j.cantidad),ultima_actualizacion:serverTimestamp()},{merge:true});
      b.set(doc(db,C.bajas,'baja_'+id+'_'+ix),{anulado:true,anulado_ms:ms},{merge:true});
      b.set(doc(collection(db,C.mov)),{materia_prima_id:j.materia_prima_id,nombre:j.nombre,tipo:'anulacion_baja',cantidad:j.cantidad,registro_id:id,fecha_ms:ms,fecha:serverTimestamp()})});
  }
  if(r.cola_id&&!r.impresa)b.set(doc(db,C.cola,r.cola_id),{cancelada:true,estado:'cancelada'},{merge:true});
  b.commit();if(!silent){buzz();toast('Registro anulado'+((r.impresa&&r.etiquetas>0)?' · descarta '+r.etiquetas+(r.etiquetas===1?' etiqueta impresa':' etiquetas impresas'):''));};
};

/* --- Código de seguridad para pruebas y borrado --- */
const zonaOk=()=>(pr.zonaHasta||0)>Date.now();
let pinBuf='',pinCb=null;
function pinDibujar(titulo,sub){
  $('mbody').innerHTML=`<div style="font-weight:800;font-size:18px;text-align:center">${esc(titulo)}</div><div class="mu" style="text-align:center;margin-bottom:6px">${esc(sub||'')}</div><div class="big" style="letter-spacing:10px">${'●'.repeat(pinBuf.length)}${'○'.repeat(4-pinBuf.length)}</div><div class="kp">${['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k=>k?`<button class="btn" onclick="pinK('${k}')">${k}</button>`:'<span></span>').join('')}</div><div class="row" style="margin:12px 0 0"><button class="btn" style="flex:1" onclick="pinNo()">Cancelar</button></div>`;
  $('modal').style.display='flex';
}
let pinTitulo='',pinSub='';
function pinModal(titulo,sub,cb){pinBuf='';pinCb=cb;pinTitulo=titulo;pinSub=sub;pinDibujar(titulo,sub)}
window.pinK=k=>{buzz();if(k==='⌫')pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<4)pinBuf+=k;
  pinDibujar(pinTitulo,pinSub);
  if(pinBuf.length===4){const cb=pinCb,p=pinBuf;pinCb=null;pinBuf='';$('modal').style.display='none';setTimeout(()=>cb&&cb(p),0)}};
window.pinNo=()=>{pinCb=null;pinBuf='';$('modal').style.display='none'};
async function hashPin(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('fusa|'+p));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'plain|'+p}}
function abrirZona(){pr.zonaHasta=Date.now()+10*60000;pr.zonaAbierta=true;if(mOpen)menuDibujar();else render()}
function crearPin(despues){
  pinModal('Crea tu código','4 números',p1=>pinModal('Repite el código','Para confirmar',async p2=>{
    if(p1!==p2){toast('Los códigos no coinciden');return}
    setDoc(doc(db,C.cfg,'seguridad'),{pin_hash:await hashPin(p1),actualizado_ms:Date.now()});
    toast('Código guardado');despues&&despues();
  }));
}
window.prZona=()=>{
  if(zonaOk()){pr.zonaAbierta=!pr.zonaAbierta;if(mOpen)menuDibujar();else render();return}
  const h=(S.cfg.seguridad||{}).pin_hash;
  if(!h){crearPin(abrirZona);return}
  pinModal('Código de pruebas','Escríbelo para continuar',async p=>{if(await hashPin(p)===h)abrirZona();else toast('Código incorrecto')});
};
function pedirAdmin(cb){
  if(zonaOk()||pr.adminSes){cb();return}
  const h=(S.cfg.seguridad||{}).pin_hash;
  if(!h){crearPin(()=>{pr.adminSes=true;cb()});return}
  pinModal('Código de administrador','Escríbelo para continuar',async p=>{if(await hashPin(p)===h){pr.adminSes=true;cb()}else{buzz(true);toast('Código incorrecto')}});
}
window.prBloquear=()=>{pr.zonaHasta=0;pr.zonaAbierta=false;render()};
window.prCambiarPin=()=>{if(!zonaOk()){prZona();return}crearPin(null)};

/* --- Borrar pruebas / empezar de cero --- */
let cfcb=null,cfExige=null;
function confirmar(titulo,texto,exige,cb){
  cfcb=cb;cfExige=exige;
  $('mbody').innerHTML=`<div style="font-weight:800;font-size:18px;margin-bottom:8px">${esc(titulo)}</div><div class="mu" style="margin-bottom:12px">${esc(texto)}</div>${exige?`<div class="f" style="margin-bottom:12px"><label>Escribe ${esc(exige)} para confirmar</label><input id="cf_t" autocomplete="off"></div>`:''}<div class="row" style="margin:0"><button class="btn" style="flex:1" onclick="cfNo()">Cancelar</button><button class="btn d" style="flex:1" onclick="cfOk()">Sí, borrar</button></div>`;
  $('modal').style.display='flex';
}
window.cfNo=()=>{cfcb=null;$('modal').style.display='none'};
window.cfOk=()=>{
  if(cfExige&&($('cf_t').value.trim().toUpperCase()!==cfExige)){toast('Escribe '+cfExige+' para confirmar');return}
  const cb=cfcb;cfNo();cb&&cb();
};
async function vaciar(col,filtro){
  const s=await getDocs(collection(db,col));
  const refs=s.docs.filter(d=>!filtro||filtro(d.data())).map(d=>d.ref);
  for(let i=0;i<refs.length;i+=400){const b=writeBatch(db);refs.slice(i,i+400).forEach(r=>b.delete(r));await b.commit()}
  return refs.length;
}
window.prBorrarPruebas=()=>{if(!zonaOk()){prZona();return}menuCerrar();confirmar('Borrar los registros de Modo prueba','Se borran todos los registros hechos en Modo prueba y sus etiquetas. No toca el inventario real ni los registros reales.',null,async()=>{
  try{const n=await vaciar(C.pruebas);await vaciar(C.cola,d=>d.prueba===true);toast(n+' registros de prueba borrados')}catch(e){toast('No se pudo borrar: '+(e.message||e))}})};
window.prReiniciar=()=>{if(!zonaOk()){prZona();return}menuCerrar();confirmar('Empezar de cero','Borra TODOS los registros de producción (reales y de prueba), el inventario de producto terminado, los movimientos, las bajas y la cola de etiquetas. Las materias primas vuelven al stock que tenían antes de producir. Se conservan los productos, las fichas y las materias primas.','BORRAR',async()=>{
  try{
    const back={};
    S.prod.filter(r=>!r.anulado).forEach(r=>{[...(r.insumos||[]),...(r.bajas||[])].forEach(i=>{if(i.materia_prima_id)back[i.materia_prima_id]=(back[i.materia_prima_id]||0)+i.cantidad})});
    const b=writeBatch(db);Object.entries(back).forEach(([id,q])=>b.set(doc(db,C.mp,id),{cantidad_actual:increment(q)},{merge:true}));
    if(Object.keys(back).length)await b.commit();
    for(const c of [C.prod,C.pruebas,C.mov,C.bajas,C.cola,C.inv])await vaciar(c);
    pr.sel=null;pr.cant='';toast('Listo: empezamos de cero');render();
  }catch(e){toast('No se pudo borrar: '+(e.message||e))}})};

/* --- Fichas de producto --- */
function vFichas(){
  const todos=S.cat.filter(p=>p.subcategoria==='facility');
  const lista=todos.filter(p=>!pr.soloFaltan||!tieneVida(ficha(p)));
  const filas=Object.entries(AREAS).map(([k,v])=>{const ps=lista.filter(p=>(p.area_produccion||AREA0)===k);return ps.length?`<h4 style="margin:12px 0 4px">${v}</h4><table>${ps.map(p=>{const f=ficha(p),ok=tieneVida(f);return `<tr><td><b>${esc(p.nombre)}</b><div class="mu">${esc(p.unidad_medida)}</div></td><td>${ok?`<span class="badge b-procesado">Vida útil lista</span>`:`<span class="badge b-recibido_diferencias">Falta vida útil</span>`}</td><td style="text-align:right"><button class="btn sm" onclick="fdAbrir('${p.id}')">Editar ficha</button></td></tr>`}).join('')}</table>`:''}).join('');
  return `<div class="row"><button class="btn" onclick="prMode('op')">← Volver</button><label style="display:flex;gap:8px;align-items:center;margin:0"><input type="checkbox" style="width:24px;height:24px;min-height:0" ${pr.soloFaltan?'checked':''} onchange="prSolo(this.checked)"> Mostrar solo los que faltan</label></div><div class="box">${filas||'<div class="empty">No hay productos.</div>'}</div>`;
}
window.fdAbrir=id=>{
  const p=S.cat.find(x=>x.id===id);if(!p)return;const f=ficha(p);
  fd={id,nombre:p.nombre,estacion:p.area_produccion||AREA0,presentacion:f.presentacion,unidad:f.unidad,codigo:f.codigo,decimales:f.decimales==1,batch:f.batch,solo_batch:f.solo_batch==1,por_etiqueta:f.por_etiqueta,max:f.max,meta_diaria:f.meta_diaria||0,modo_defecto:f.modo_defecto,vida:{...f.vida},receta:f.receta.map(r=>({...r})),foto:f.foto||null};
  pr.mode='ficha';render();
};
window.fdSet=(k,v,n)=>{fd[k]=n?(parseFloat(String(v).replace(',','.'))||0):v};
window.fdChk=(k,v)=>{fd[k]=v};
window.fdVida=(m,v)=>{fd.vida[m]=Math.max(0,parseInt(v)||0)};
window.fdRQ=(ix,v)=>{fd.receta[ix].cantidad=parseFloat(String(v).replace(',','.'))||0};
window.fdRDel=ix=>{fd.receta.splice(ix,1);render()};
window.fdRAdd=()=>{
  const id=$('fd_mp').value,q=parseFloat(String($('fd_mpq').value).replace(',','.'))||0,m=S.mp[id];

   ${mps.length?`<div class="row" style="margin-top:10px"><div class="f"><label>Materia prima</label><select id="fd_mp">${mps.map(([id,m])=>`<option value="${id}">${esc(m.nombre)} (${esc(m.unidad)})</option>`).join('')}</select></div><div class="f"><label>Cantidad por batch</label><input id="fd_mpq" type="number" step="any" inputmode="decimal"></div><button class="btn" onclick="fdRAdd()">+ Agregar insumo</button></div>`:'<div class="mu">Primero crea materias primas en ⚙ → Materias primas.</div>'}</div>
  <div class="row"><button class="btn" onclick="prMode('fichas')">Cancelar</button><button class="btn g" onclick="fdGuardar()">Guardar ficha</button></div>`;
}
window.fdFoto=inp=>{
  const f=inp.files&&inp.files[0];if(!f)return;
  const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{
    const k=Math.min(1,520/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);fd.foto=c.toDataURL('image/jpeg',.8);render()};im.onerror=()=>toast('No se pudo leer la foto');im.src=rd.result};
  rd.readAsDataURL(f);
};
window.fdFotoQ=()=>{fd.foto=null;render()};
window.fdGuardar=()=>{
  if(!(fd.batch>0)){toast('El batch debe ser mayor que 0');return}
  const data={producto_id:fd.id,nombre:fd.nombre,presentacion:fd.presentacion,unidad:fd.unidad,codigo:(asciiZ(fd.codigo).replace(/[^A-Za-z0-9]/g,'').toUpperCase().slice(0,3))||'PRD',decimales:fd.decimales?1:0,batch:fd.batch,solo_batch:fd.solo_batch?1:0,por_etiqueta:fd.por_etiqueta||0,max:fd.max||0,meta_diaria:fd.meta_diaria||0,modo_defecto:fd.modo_defecto,vida:fd.vida,receta:fd.receta.filter(r=>r.cantidad>0),foto:fd.foto||null,seccion:fd.estacion,actualizado_ms:Date.now(),actualizado_por:quien||''};
  setDoc(doc(db,C.fichas,fd.id),data,{merge:true});
  const p=S.cat.find(x=>x.id===fd.id);
  if(p&&(p.area_produccion||AREA0)!==fd.estacion)updateDoc(doc(db,C.cat,fd.id),{area_produccion:fd.estacion,categoria:fd.estacion==='panaderia'?'panaderia':'cocina'});
  if(p&&(p.presentacion||'')!==fd.presentacion)updateDoc(doc(db,C.cat,fd.id),{presentacion:fd.presentacion});
  buzz();toast('Ficha guardada');pr.mode='fichas';render();
};

/* ============ PANEL DE PRODUCCIÓN (consulta + avisos) ============ */
const dash={f:'hoy',desde:'',hasta:'',q:'',sel:null};
const DIA_MS=864e5;
function hora12(ms,conFecha){const d=new Date(ms),h=d.getHours(),m=String(d.getMinutes()).padStart(2,'0');return (conFecha?d.getDate()+' '+MESES[d.getMonth()]+', ':'')+(h%12||12)+':'+m+' '+(h<12?'AM':'PM')}
function esHoy(ms){return new Date(ms).toDateString()===new Date().toDateString()}
function rangoDash(){
  const d0=new Date();d0.setHours(0,0,0,0);const t0=d0.getTime();
  if(dash.f==='hoy')return [t0,t0+DIA_MS];
  if(dash.f==='ayer')return [t0-DIA_MS,t0];
  if(dash.f==='7')return [t0-6*DIA_MS,t0+DIA_MS];
  const a=dash.desde?new Date(dash.desde+'T00:00:00').getTime():-Infinity;
  const b=dash.hasta?new Date(dash.hasta+'T00:00:00').getTime()+DIA_MS:Infinity;
  return [a,b];
}
function diasPeriodo(){const [a,b]=rangoDash();if(!isFinite(a)||!isFinite(b)||b<=a)return 0;return Math.max(1,Math.round((b-a)/DIA_MS))}
const unidadDe=r=>String(r.unidad_base||String(r.unidad_medida||'').split(' · ')[0]||'').trim();
const faltaDe=g=>g.meta>0?Math.max(0,r2(g.meta-g.total,2)):0;
function gruposDash(){
  const [a,b]=rangoDash(),nd=diasPeriodo();
  const regs=S.prod.filter(r=>!r.anulado&&r.producto_id&&r.fecha_ms>=a&&r.fecha_ms<b);
  const g={};
  regs.forEach(r=>{
    const u=unidadDe(r),k=r.producto_id+'|'+u.toLowerCase();
    const o=g[k]||(g[k]={key:k,producto_id:r.producto_id,nombre:r.producto_nombre||'',unidad:u,total:0,ult:0,regs:[],meta:0});
    o.total=r2(o.total+cantReg(r),3);o.ult=Math.max(o.ult,r.fecha_ms);o.regs.push(r);
  });
  // metas: solo se comparan cantidades con la misma unidad; productos con meta y sin producción aparecen en cero
  if(nd)S.cat.filter(p=>p.subcategoria==='facility').forEach(p=>{
    const f=ficha(p);if(!(f.meta_diaria>0))return;
    const u=String(f.unidad||'').trim(),k=p.id+'|'+u.toLowerCase(),metaTot=r2(f.meta_diaria*nd,2);
    if(g[k])g[k].meta=metaTot;
    else if(!Object.values(g).some(x=>x.producto_id===p.id))g[k]={key:k,producto_id:p.id,nombre:p.nombre,unidad:u,total:0,ult:0,regs:[],meta:metaTot};
  });
  const pri=x=>faltaDe(x)>0?(x.total===0?2:1):0;
  const grupos=Object.values(g).sort((x,y)=>pri(x)!==pri(y)?pri(y)-pri(x):y.ult-x.ult);
  return {regs,grupos};
}
const nfmt=v=>Number(v).toLocaleString('es-US',{maximumFractionDigits:2});
window.dashF=f=>{dash.f=f;dash.sel=null;if(f==='rango'&&!dash.desde){const d=new Date(),s=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');dash.desde=s;dash.hasta=s}render()};
window.dashRango=(k,v)=>{dash[k]=v;dash.sel=null;render()};
window.dashSel=k=>{dash.sel=decodeURIComponent(k);render();try{window.scrollTo(0,0)}catch(e){}};
window.dashVolver=()=>{dash.sel=null;render()};
window.dashBuscar=v=>{dash.q=v;const q=v.toLowerCase();document.querySelectorAll('.dtab tr.dr').forEach(tr=>tr.style.display=tr.dataset.n.includes(q)?'':'none')};
window.dashEquipo=()=>{pr.desdePanel=true;pr.mode='equipo';view='produccion';render()};
function etiquetaPeriodo(){
  if(dash.f==='hoy')return 'Hoy · '+fAbr(new Date());
  if(dash.f==='ayer')return 'Ayer · '+fAbr(new Date(Date.now()-DIA_MS));
  if(dash.f==='7')return 'Últimos 7 días';
  return 'Del '+(dash.desde||'…')+' al '+(dash.hasta||'…');
}
const estadoTxt=g=>{const f=faltaDe(g);return f>0?(dash.f==='hoy'?'Faltan ':'Faltaron ')+nfmt(f):'Cumplió'};
function vDash(){
  const {regs,grupos}=gruposDash();
  const filtros=[['hoy','Hoy'],['ayer','Ayer'],['7','Últimos 7 días'],['rango','Rango de fechas']].map(([k,v])=>`<button class="btn ${dash.f===k?'p':''}" onclick="dashF('${k}')">${v}</button>`).join('');
  const rango=dash.f==='rango'?`<div class="row"><div class="f" style="max-width:200px"><label>Desde</label><input type="date" value="${esc(dash.desde)}" onchange="dashRango('desde',this.value)"></div><div class="f" style="max-width:200px"><label>Hasta</label><input type="date" value="${esc(dash.hasta)}" onchange="dashRango('hasta',this.value)"></div></div>`:'';
  const head=`<div class="row">${filtros}<span style="flex:1"></span><button class="btn sm" onclick="dashEquipo()">Equipo y teléfonos</button></div>${rango}`;
  if(dash.sel){
    const g=grupos.find(x=>x.key===dash.sel);
    if(!g)return head+`<div class="row"><button class="btn" onclick="dashVolver()">← Volver a la lista</button></div><div class="box empty">Ese producto no tiene registros en este periodo.</div>`;
    const falta=faltaDe(g),enc=encodeURIComponent(g.key);
    const ultAv=Object.values(S.avisos).filter(a=>a.producto_id===g.producto_id).sort((a,b)=>b.fecha_ms-a.fecha_ms)[0];
    const filas=g.regs.slice().sort((a,b)=>b.fecha_ms-a.fecha_ms).map(r=>`<tr><td>${esc(fAbr(new Date(r.fecha_ms)))}<div class="mu">${hora12(r.fecha_ms)}</div></td><td class="dq">${nfmt(cantReg(r))} <span class="mu" style="font-size:14px;font-weight:600">${esc(unidadDe(r))}</span></td><td>${esc(r.por||r.operador||'—')}</td><td class="mu">${esc(r.lote||'—')}</td></tr>`).join('');
    return head+`<div class="row"><button class="btn" onclick="dashVolver()">← Volver a la lista</button></div>
    <div class="box"><div class="mu" style="font-weight:700">${esc(etiquetaPeriodo())}</div><h2 style="margin:4px 0 2px">${esc(g.nombre)}</h2><div class="dq" style="font-size:34px">${nfmt(g.total)} <span class="mu" style="font-size:18px">${esc(g.unidad)}</span></div><div class="mu">Total elaborado · ${g.regs.length} ${g.regs.length===1?'registro':'registros'}</div>
     ${g.meta>0?`<div class="dm ${falta>0?'bad':'good'}" style="font-size:16px;margin-top:8px">Meta ${nfmt(g.meta)} ${esc(g.unidad)} · ${estadoTxt(g)}</div>`:`<div class="mu" style="margin-top:8px">Sin meta diaria definida.</div>`}
     <div class="row" style="margin:12px 0 0"><button class="btn ${falta>0?'g':''}" onclick="avAbrir('${enc}')">Avisar al responsable</button><button class="btn" onclick="dashMeta('${esc(g.producto_id)}')">${g.meta>0?'Cambiar meta diaria':'Definir meta diaria'}</button></div>
     ${ultAv?`<div class="mu" style="margin-top:8px">Último aviso: ${esc(ultAv.destinatario)} · ${ultAv.canal==='wa'?'WhatsApp':'SMS'} · ${esc(hora12(ultAv.fecha_ms,!esHoy(ultAv.fecha_ms)))}</div>`:''}</div>
    <div class="box"><h3>Historial de registros</h3>${g.regs.length?`<table class="dtab"><tr><th>Fecha y hora</th><th>Cantidad</th><th>Responsable</th><th>Lote</th></tr>${filas}</table>`:'<div class="mu">No se registró producción en este periodo.</div>'}</div>`;
  }
  const ultima=regs.length?Math.max(...regs.map(r=>r.fecha_ms)):0;
  const nProd=new Set(regs.map(r=>r.producto_id)).size;
  const kpis=`<div class="kpis"><div class="kpi"><span>Producciones registradas</span><b>${regs.length}</b></div><div class="kpi"><span>Productos elaborados</span><b>${nProd}</b></div><div class="kpi"><span>Última producción</span><b>${ultima?hora12(ultima,!esHoy(ultima)):'—'}</b></div></div>`;
  const conMeta=grupos.filter(g=>g.meta>0),bajo=conMeta.filter(g=>faltaDe(g)>0).length;
  const aviso=conMeta.length?(bajo?`<div class="dm bad" style="font-size:15px;margin:0 0 8px">⚠ ${bajo} ${bajo===1?'producto está':'productos están'} por debajo de la meta</div>`:`<div class="dm good" style="font-size:15px;margin:0 0 8px">✓ Todas las metas cumplidas</div>`):'';
  const q=dash.q.toLowerCase();
  const filas=grupos.map(g=>{const f=faltaDe(g),enc=encodeURIComponent(g.key);return `<tr class="dr" data-n="${esc(g.nombre.toLowerCase())}" style="${q&&!g.nombre.toLowerCase().includes(q)?'display:none':''}" onclick="dashSel('${enc}')"><td><b>${esc(g.nombre)}</b></td><td><div class="dq">${nfmt(g.total)} <span class="mu" style="font-size:14px;font-weight:600">${esc(g.unidad)}</span></div>${g.meta>0?`<div class="dm ${f>0?'bad':'good'}">Meta ${nfmt(g.meta)} · ${estadoTxt(g)}</div>`:''}</td><td>${g.ult?hora12(g.ult,!esHoy(g.ult)):'—'}</td><td style="text-align:right">${f>0?`<button class="btn sm" onclick="event.stopPropagation();avAbrir('${enc}')">Avisar</button>`:''}</td></tr>`}).join('');
  return head+kpis+`<div class="box"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h3 style="margin:0">Productos elaborados <span class="mu" style="font-weight:600;font-size:14px">· ${esc(etiquetaPeriodo())}</span></h3><input placeholder="Buscar producto" style="max-width:260px" value="${esc(dash.q)}" oninput="dashBuscar(this.value)"></div>${aviso}${grupos.length?`<table class="dtab"><tr><th>Producto</th><th>Cantidad producida</th><th>Última producción</th><th></th></tr>${filas}</table>`:'<div class="empty">No hay producciones registradas en este periodo.</div>'}</div>`;
}
window.dashMeta=pid=>{
  const p=S.cat.find(x=>x.id===pid);if(!p)return;const f=ficha(p);
  abrirCantidad('Meta diaria de '+p.nombre+' ('+f.unidad+')',f.meta_diaria||1,v=>{
    setDoc(doc(db,C.fichas,pid),{producto_id:pid,nombre:p.nombre,meta_diaria:v>0?v:0,actualizado_ms:Date.now()},{merge:true});
    toast(v>0?'Meta diaria guardada':'Meta quitada');
  });
};

/* ============ EQUIPO Y TELÉFONOS ============ */
const normN=s=>sinAcento(s).toLowerCase().replace(/\s+/g,' ').trim();
const eqList=()=>Object.entries(S.equipo).map(([id,e])=>({id,...e})).filter(e=>e.activo!==false&&e.nombre).sort((a,b)=>a.nombre.localeCompare(b.nombre));
function telNorm(s){let d=String(s||'').replace(/\D/g,'');if(d.length===10)d='1'+d;return d}
const telOk=d=>d.length>=11&&d.length<=15;
function vEquipo(){
  const rows=eqList().map(e=>`<tr><td><b>${esc(e.nombre)}</b></td><td>+${esc(telNorm(e.telefono))}</td><td style="text-align:right"><button class="btn sm d" onclick="eqDel('${e.id}')">Quitar</button></td></tr>`).join('');
  return `<div class="row"><button class="btn" onclick="eqVolver()">← Volver</button><b style="font-size:20px">Equipo y teléfonos</b></div>
  <div class="box"><h3>Agregar persona</h3><div class="mu" style="margin-bottom:8px">Escribe el celular con código de país (ej. 1 973 555 1234). Si son 10 números, se asume Estados Unidos (+1). El nombre debe ser el mismo que se escribe en "Quién registra".</div><div class="row"><div class="f"><label>Nombre</label><input id="eq_n"></div><div class="f"><label>Celular (WhatsApp / SMS)</label><input id="eq_t" type="tel" inputmode="tel"></div><button class="btn p" onclick="eqAdd()">Agregar</button></div></div>
  <div class="box">${rows?`<table>${rows}</table>`:'<div class="empty">Todavía no hay personas en el equipo.</div>'}</div>`;
}
window.eqVolver=()=>{if(pr.desdePanel){pr.desdePanel=false;pr.mode='op';view='panel'}else pr.mode='op';render()};
window.eqAdd=()=>{
  const n=$('eq_n').value.trim(),t=telNorm($('eq_t').value);
  if(!n){toast('Falta el nombre');return}
  if(!telOk(t)){toast('Celular inválido: incluye el código de país');return}
  setDoc(doc(db,C.equipo,newId(C.equipo)),{nombre:n,telefono:t,activo:true,creado_ms:Date.now()});toast('Persona agregada');
};
window.eqDel=id=>{const e=S.equipo[id];if(!e)return;const copia={...e};deleteDoc(doc(db,C.equipo,id));toast('Persona quitada',()=>setDoc(doc(db,C.equipo,id),copia))};

/* ============ AVISAR AL RESPONSABLE (WhatsApp / SMS) ============ */
const av={g:null,tipo:'rec',to:'',nombre:'',tel:'',texto:'',editado:false};
function avPer(){
  const g=av.g;
  if(g.f==='hoy')return 'Hoy, hasta ahora,';
  if(g.f==='ayer')return 'Ayer';
  if(g.f==='7')return 'En los últimos 7 días';
  return 'Entre el '+(g.desde||'…')+' y el '+(g.hasta||'…');
}
function avNombre(){const e=(av.to&&av.to!=='otro')?S.equipo[av.to]:null;return String((e?e.nombre:av.nombre)||'').trim().split(' ')[0]||''}
function avArmar(){
  const g=av.g,nom=avNombre(),sal=nom?'Hola '+nom+',':'Hola,',u=g.unidad;
  const hecho=`${avPer()} se registraron ${nfmt(g.total)} ${u} de ${g.nombre}`;
  const meta=g.meta>0?` y la meta es ${nfmt(g.meta)} ${u}${g.falta>0?' (faltan '+nfmt(g.falta)+')':''}`:'';
  if(av.tipo==='atn')return `${sal} te escribo por la producción de ${g.nombre}. ${hecho}${meta}. Es importante cumplir con la producción porque los locales dependen de ella. Necesito que me expliques qué pasó y cómo vamos a evitar que se repita. Hablemos hoy, por favor. — Morochos Coffee`;
  return `${sal} te escribo de Morochos Coffee por la producción de ${g.nombre}. ${hecho}${meta}. ¿Puedes revisarlo y contarme si necesitas apoyo o más tiempo para llegar? Gracias.`;
}
window.avAbrir=key=>{
  const {grupos}=gruposDash(),g=grupos.find(x=>x.key===decodeURIComponent(key));if(!g)return;
  const ult=g.regs.slice().sort((a,b)=>b.fecha_ms-a.fecha_ms)[0],por=ult&&ult.por?ult.por:'';
  av.g={producto_id:g.producto_id,nombre:g.nombre,unidad:g.unidad,total:g.total,meta:g.meta||0,falta:faltaDe(g),f:dash.f,desde:dash.desde,hasta:dash.hasta,periodo:etiquetaPeriodo()};
  av.tipo='rec';av.to='';av.nombre='';av.tel='';av.editado=false;
  const m=por&&eqList().find(e=>normN(e.nombre)===normN(por));
  if(m)av.to=m.id;else if(por){av.to='otro';av.nombre=por}
  av.texto=avArmar();avDibujar();
};
function avDibujar(){
  const g=av.g,eq=eqList();
  $('mbody').style.maxWidth='520px';
  $('mbody').innerHTML=`<div style="font-weight:800;font-size:18px">Avisar por ${esc(g.nombre)}</div>
  <div class="mu" style="margin:2px 0 10px">${esc(g.periodo)} · ${nfmt(g.total)} ${esc(g.unidad)}${g.meta>0?' de '+nfmt(g.meta)+(g.falta>0?' · faltan '+nfmt(g.falta):' · cumplió'):''}</div>
  <div class="row" style="margin-bottom:8px"><button class="btn sm ${av.tipo==='rec'?'p':''}" onclick="avTipo('rec')">Recordatorio</button><button class="btn sm ${av.tipo==='atn'?'p':''}" onclick="avTipo('atn')">Llamado de atención</button></div>
  <div class="row" style="margin-bottom:8px"><div class="f"><label>Para</label><select onchange="avPara(this.value)"><option value="">Elegir persona</option>${eq.map(e=>`<option value="${e.id}" ${av.to===e.id?'selected':''}>${esc(e.nombre)}</option>`).join('')}<option value="otro" ${av.to==='otro'?'selected':''}>Otra persona…</option></select></div></div>
  ${av.to==='otro'?`<div class="row" style="margin-bottom:8px"><div class="f"><label>Nombre</label><input value="${esc(av.nombre)}" onchange="avCampo('nombre',this.value)"></div><div class="f"><label>Celular con código de país</label><input type="tel" inputmode="tel" placeholder="1 973 555 1234" value="${esc(av.tel)}" onchange="avCampo('tel',this.value)"></div></div>`:''}
  <div class="f" style="margin-bottom:10px"><label>Mensaje (puedes editarlo)</label><textarea class="av-t" oninput="avTexto(this.value)">${esc(av.texto)}</textarea></div>
  <div class="row" style="margin:0"><button class="btn g" style="flex:1" onclick="avEnviar('wa')">WhatsApp</button><button class="btn p" style="flex:1" onclick="avEnviar('sms')">SMS</button><button class="btn" onclick="avCerrar()">Cancelar</button></div>
  <div class="mu" style="margin-top:8px;font-size:12px">Se abre tu WhatsApp o tus Mensajes con el texto listo; tú tocas enviar.</div>`;
  $('modal').style.display='flex';
}
window.avTipo=t=>{av.tipo=t;av.editado=false;av.texto=avArmar();avDibujar()};
window.avPara=id=>{av.to=id;av.editado=false;av.texto=avArmar();avDibujar()};
window.avCampo=(k,v)=>{av[k]=v;if(k==='nombre'&&!av.editado){av.texto=avArmar();avDibujar()}};
window.avTexto=v=>{av.texto=v;av.editado=true};
window.avCerrar=()=>{$('modal').style.display='none';$('mbody').style.maxWidth=''};
window.avEnviar=canal=>{
  if(!av.to){toast('Elige a quién avisar');return}
  let tel,nombre;
  if(av.to!=='otro'){const e=S.equipo[av.to];tel=telNorm(e.telefono);nombre=e.nombre}else{tel=telNorm(av.tel);nombre=av.nombre.trim()}
  if(!telOk(tel)){toast('Escribe el celular con código de país (ej. 1 973 555 1234)');return}
  const texto=av.texto.trim();if(!texto){toast('El mensaje está vacío');return}
  if(av.to==='otro'&&nombre&&!eqList().some(e=>telNorm(e.telefono)===tel))setDoc(doc(db,C.equipo,newId(C.equipo)),{nombre,telefono:tel,activo:true,creado_ms:Date.now()});
  const g=av.g;
  setDoc(doc(db,C.avisos,newId(C.avisos)),{producto_id:g.producto_id,producto_nombre:g.nombre,destinatario:nombre||('+'+tel),telefono:tel,canal,tipo:av.tipo,texto,periodo:g.periodo,total:g.total,meta:g.meta,unidad:g.unidad,enviado_por:quien||'',fecha_ms:Date.now(),fecha:serverTimestamp()});
  const url=canal==='wa'?'https://wa.me/'+tel+'?text='+encodeURIComponent(texto):'sms:+'+tel+'?&body='+encodeURIComponent(texto);
  avCerrar();
  window.open(url,canal==='wa'?'_blank':'_self');
  toast('Aviso preparado para '+(nombre||('+'+tel)));
};

/* ============ GUÍAS DE DESPACHO + RECEPCIÓN ============ */
let gcart={},glocal='',gpeds=[],rec=null,motcb=null;
const MOTIVOS=['Faltó','Llegó dañado / mala calidad','No era lo pedido','Llegó caliente / sin frío','Otro'];
const EST_G={por_despachar:'Por despachar',despachado:'Despachado',recibido_ok:'Recibido OK',recibido_diferencias:'Con diferencias'};

function vGuias(){
  if(modo==='nueva')return vNuevaGuia();
  if(modo==='recibir')return vRecibir();
  const list=S.guias.map(g=>{
    const items=(g.items||[]).map(i=>`<tr><td>${esc(i.producto_nombre)}</td><td>${esc(i.cantidad_despachada)} ${esc(i.unidad_medida)}</td>${i.cantidad_recibida!=null?`<td style="${i.diferencia?'color:var(--er);font-weight:700':'color:var(--mu)'}">Recibido: ${esc(i.cantidad_recibida)}${i.nota_diferencia?' · '+esc(i.nota_diferencia):''}</td>`:'<td></td>'}</tr>`).join('');
    return `<div class="box"><div class="row" style="justify-content:space-between;margin:0 0 8px"><div><b style="font-size:18px">${esc(LOCALES[g.local]||g.local)}</b> <span class="badge b-${g.estado}">${esc(EST_G[g.estado]||g.estado)}</span><div class="mu">${fecha(g.fecha_ms)} · ${esc(g.despachado_por||'')}${g.recibido_por?' · Recibió: '+esc(g.recibido_por):''}</div></div>
     <div class="row" style="margin:0">${g.estado==='por_despachar'?`<button class="btn sm g" onclick="despachar('${g.id}')">Despachar</button><button class="btn sm d" onclick="delGuia('${g.id}')">Eliminar</button>`:''}${g.estado==='despachado'?`<button class="btn sm g" onclick="recibir('${g.id}')">Recibir</button>`:''}<button class="btn sm" onclick="imprimirGuia('${g.id}')">Imprimir</button></div></div><table>${items}</table></div>`}).join('');
  return `<div class="row"><button class="btn p" onclick="nuevaGuia()">+ Nueva guía</button></div>${list||'<div class="empty">Todavía no hay guías.</div>'}`;
}

/* --- Crear guía --- */
window.nuevaGuia=()=>{modo='nueva';gcart={};gpeds=[];render()};
window.cancelarGuia=()=>{modo='lista';gcart={};gpeds=[];render()};
window.setGLocal=v=>{glocal=v;gcart={};gpeds=[];render()};
function vNuevaGuia(){
  const prods=S.cat.filter(p=>p.subcategoria!=='mercado');
  const cards=prods.map(p=>{const q=gcart[p.id];return `<div class="card ${q?'sel':''}" data-n="${esc(p.nombre.toLowerCase())}" onclick="tapG('${p.id}')">${q?`<span class="q">${q}</span><span class="ck">✓</span>`:''}${thumb(p)}<div class="n">${esc(p.nombre)}</div><div class="u">${esc(p.unidad_medida)}</div></div>`}).join('');
  return `<div class="row"><div class="f"><label>Local destino</label><select onchange="setGLocal(this.value)"><option value="">Elegir local</option>${Object.entries(LOCALES).map(([k,v])=>`<option value="${k}" ${k===glocal?'selected':''}>${v}</option>`).join('')}</select></div>
   <button class="btn w" onclick="cargarPend()">Cargar pedidos pendientes del local</button>
   <div class="f"><label>Buscar</label><input placeholder="Buscar producto" oninput="filtrar(this.value)"></div></div>
   <div class="grid">${cards||'<div class="empty" style="grid-column:1/-1">No hay productos de bodega o facility en el catálogo.</div>'}</div>
   <div class="row" style="margin-top:16px;position:sticky;bottom:10px;background:#f4f2ecee;padding:8px;border-radius:14px"><b>${Object.keys(gcart).length} productos</b><span style="flex:1"></span>
    <button class="btn" onclick="cancelarGuia()">Cancelar</button><button class="btn g" onclick="crearGuia()">Crear guía</button></div>`;
}
window.cargarPend=()=>{
  if(!glocal){toast('Elige el local');return}
  gpeds=S.ped.filter(p=>p.local===glocal&&(p.estado==='enviado'||p.estado==='en_proceso')&&!p.despacho_id);
  gcart={};
  gpeds.forEach(p=>(p.items||[]).filter(i=>i.subcategoria!=='mercado').forEach(i=>{
    const q=(p.ajustes&&p.ajustes[i.producto_id]!=null)?p.ajustes[i.producto_id]:i.cantidad;
    if(q>0)gcart[i.producto_id]=Math.round(((gcart[i.producto_id]||0)+q)*100)/100;
  }));
  render();toast(Object.keys(gcart).length?'Pedidos cargados':'No hay pendientes para este local');
};
window.tapG=id=>{buzz();const p=S.cat.find(x=>x.id===id);abrirCantidad(p.nombre+' ('+p.unidad_medida+')',gcart[id]||1,v=>{if(v>0)gcart[id]=v;else delete gcart[id];render()})};
window.crearGuia=()=>{
  const ids=Object.keys(gcart);
  if(!glocal){toast('Elige el local');return}
  if(!ids.length){toast('La guía está vacía');return}
  const items=ids.map(id=>{const p=S.cat.find(x=>x.id===id);return {producto_id:id,producto_nombre:p.nombre,categoria:p.categoria,subcategoria:p.subcategoria,unidad_medida:p.unidad_medida,cantidad_despachada:gcart[id],origen:p.subcategoria==='facility'?'procesado':'stock',cantidad_recibida:null,diferencia:null,nota_diferencia:''}});
  const id=newId(C.guias),b=writeBatch(db);
  b.set(doc(db,C.guias,id),{local:glocal,estado:'por_despachar',fecha_ms:Date.now(),fecha_despacho:null,fecha_recepcion:null,despachado_por:quien||'',recibido_por:null,items,pedidos:gpeds.map(p=>p.id)});
  gpeds.forEach(p=>b.update(doc(db,C.ped,p.id),{despacho_id:id,estado:'en_proceso',fecha_proceso:serverTimestamp()}));
  b.commit();modo='lista';gcart={};gpeds=[];render();buzz();toast('Guía creada');
};
window.delGuia=id=>{
  const g=S.guias.find(x=>x.id===id);if(!g||g.estado!=='por_despachar')return;
  const b=writeBatch(db);b.delete(doc(db,C.guias,id));
  (g.pedidos||[]).forEach(pid=>{if(S.ped.some(p=>p.id===pid))b.update(doc(db,C.ped,pid),{despacho_id:null})});
  b.commit();toast('Guía eliminada');
};
window.despachar=id=>{
  updateDoc(doc(db,C.guias,id),{estado:'despachado',fecha_despacho:serverTimestamp(),fecha_despacho_ms:Date.now(),despachado_por:quien||''});
  buzz();toast('Guía despachada',()=>updateDoc(doc(db,C.guias,id),{estado:'por_despachar',fecha_despacho:null}));
};

/* --- Recepción (Aceptar / corregir cantidades) --- */
window.recibir=id=>{
  const g=S.guias.find(x=>x.id===id);if(!g||g.estado!=='despachado'){toast('Esa guía ya no está por recibir');return}
  rec={id,local:g.local,items:(g.items||[]).map(i=>({...i,cantidad_recibida:i.cantidad_despachada,nota_diferencia:''}))};
  modo='recibir';render();
};
function vRecibir(){
  const hayDif=rec.items.some(i=>i.cantidad_recibida!==i.cantidad_despachada);
  const cards=rec.items.map((i,ix)=>{const dif=i.cantidad_recibida!==i.cantidad_despachada;return `<div class="card ${dif?'':'sel'}" style="${dif?'border-color:var(--er);background:var(--erbg)':''}" onclick="tapRec(${ix})">${dif?'':'<span class="ck">✓</span>'}<div class="th" style="background:var(--s2);font-size:30px">${esc(i.cantidad_recibida)}</div><div class="n">${esc(i.producto_nombre)}</div><div class="u">Despachado: ${esc(i.cantidad_despachada)} ${esc(i.unidad_medida)}</div>${i.nota_diferencia?`<div class="u" style="color:var(--er);font-weight:700">${esc(i.nota_diferencia)}</div>`:''}</div>`}).join('');
  return `<div class="row"><b style="font-size:20px">Recibir guía · ${esc(LOCALES[rec.local]||rec.local)}</b><span class="mu">Toca un producto si llegó distinto.</span></div>
   <div class="grid">${cards}</div>
   <div class="row" style="margin-top:16px;position:sticky;bottom:10px;background:#f4f2ecee;padding:8px;border-radius:14px"><div class="f" style="max-width:220px"><label>Quién recibe</label><input value="${esc(quien)}" onchange="setQuien(this.value)"></div><span style="flex:1"></span>
    <button class="btn" onclick="cancelarRec()">Cancelar</button><button class="btn ${hayDif?'w':'g'}" onclick="confirmarRec()">${hayDif?'Confirmar con diferencias':'Aceptar todo'}</button></div>`;
}
window.cancelarRec=()=>{rec=null;modo='lista';render()};
window.tapRec=ix=>{
  buzz();const i=rec.items[ix];
  abrirCantidad(i.producto_nombre+' ('+i.unidad_medida+')',i.cantidad_recibida,v=>{
    i.cantidad_recibida=v;
    if(v!==i.cantidad_despachada){abrirMotivo(m=>{i.nota_diferencia=m;render()})}else{i.nota_diferencia='';render()}
  });
};
function abrirMotivo(cb){
  motcb=cb;
  $('mbody').innerHTML=`<div class="mu" style="text-align:center;font-weight:700;margin-bottom:10px">¿Qué pasó?</div>`+MOTIVOS.map((m,i)=>`<button class="btn" style="width:100%;margin-bottom:8px" onclick="elegirMotivo(${i})">${m}</button>`).join('')+`<button class="btn" style="width:100%" onclick="elegirMotivo(-1)">Sin motivo</button>`;
  $('modal').style.display='flex';
}
window.elegirMotivo=i=>{const cb=motcb;cerrarM();cb&&cb(i>=0?MOTIVOS[i]:'')};
window.confirmarRec=()=>{
  const g=S.guias.find(x=>x.id===rec.id);
  if(!g||g.estado!=='despachado'){toast('Ya fue recibida');rec=null;modo='lista';render();return}
  const original=JSON.parse(JSON.stringify(g.items||[]));
  const items=rec.items.map(i=>({...i,diferencia:Math.round((i.cantidad_recibida-i.cantidad_despachada)*100)/100}));
  const dif=items.some(i=>i.diferencia!==0),id=rec.id;
  updateDoc(doc(db,C.guias,id),{estado:dif?'recibido_diferencias':'recibido_ok',fecha_recepcion:serverTimestamp(),fecha_recepcion_ms:Date.now(),recibido_por:quien||'',items});
  rec=null;modo='lista';render();buzz();
  toast(dif?'Recibida con diferencias':'Guía recibida',()=>updateDoc(doc(db,C.guias,id),{estado:'despachado',fecha_recepcion:null,fecha_recepcion_ms:null,recibido_por:null,items:original}));
};

/* --- Imprimir --- */
window.imprimirGuia=id=>{
  const g=S.guias.find(x=>x.id===id);if(!g)return;
  const w=window.open('','_blank');if(!w){toast('Permite ventanas emergentes para imprimir');return}
  const rows=(g.items||[]).map(i=>`<tr><td>${esc(i.producto_nombre)}</td><td>${esc(i.cantidad_despachada)} ${esc(i.unidad_medida)}</td><td>${i.cantidad_recibida!=null?esc(i.cantidad_recibida):''}</td></tr>`).join('');
  w.document.write(`<html><head><title>Guía de despacho</title><style>body{font:16px Arial;padding:24px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #999;padding:8px;text-align:left}</style></head><body><h2>Guía de despacho · ${esc(LOCALES[g.local]||g.local)}</h2><p>Fecha: ${esc(fecha(g.fecha_ms))}<br>Despachó: ${esc(g.despachado_por||'')}</p><table><tr><th>Producto</th><th>Despachado</th><th>Recibido</th></tr>${rows}</table><p style="margin-top:40px">Recibió: ______________________</p></body></html>`);
  w.document.close();w.focus();w.print();
};

/* ============ Pantalla completa ============ */
window.pantalla=()=>{
  const d=document,el=d.documentElement;
  if(!d.fullscreenElement&&!d.webkitFullscreenElement){
    const f=el.requestFullscreen||el.webkitRequestFullscreen;
    if(f)f.call(el);else toast('En iPhone/iPad: Compartir → Añadir a pantalla de inicio');
  }else{(d.exitFullscreen||d.webkitExitFullscreen).call(d)}
};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{$('fs').textContent=(document.fullscreenElement||document.webkitFullscreenElement)?'✕ Salir de pantalla completa':'⛶ Pantalla completa'}));

/* ============ Teclado numérico grande ============ */
let kv='',kcb=null;
function abrirCantidad(titulo,ini0,cb){
  kv=String(ini0);kcb=cb;
  $('mbody').innerHTML=`<div class="mu" style="text-align:center;font-weight:700">${esc(titulo)}</div><div class="big" id="kd">${kv}</div>
  <div class="kp">${['7','8','9','4','5','6','1','2','3','.','0','⌫'].map(k=>`<button class="btn" onclick="kp('${k}')">${k}</button>`).join('')}</div>
  <div class="row" style="margin:12px 0 0"><button class="btn" style="flex:1" onclick="cerrarM()">Cancelar</button>${titulo&&cb?`<button class="btn d" onclick="kcero()">Quitar</button>`:''}<button class="btn g" style="flex:1" onclick="kok()">Listo</button></div>`;
  $('modal').style.display='flex';kfresh=true;
}
let kfresh=true;
window.kp=k=>{buzz();if(k==='⌫'){kv=kv.slice(0,-1)}else{if(kfresh){kv='';kfresh=false}if(k==='.'&&kv.includes('.'))return;kv+=k}$('kd').textContent=kv||'0'};
window.kok=()=>{const v=num(kv||'0');const cb=kcb;cerrarM();cb&&cb(isNaN(v)?0:v)};
window.kcero=()=>{const cb=kcb;cerrarM();cb&&cb(0)};
window.cerrarM=()=>{$('modal').style.display='none';kcb=null};

ready=true;prIniciar();render();
</script>
</body>
</html>
